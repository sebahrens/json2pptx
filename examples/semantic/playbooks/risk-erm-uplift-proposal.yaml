# Risk-consulting playbook: an enterprise risk management uplift proposal for a bank (docs/wiki/playbook-risk-consulting.md)
# Validate:  json2pptx semantic validate examples/semantic/playbooks/risk-erm-uplift-proposal.yaml --templates-dir templates

meta:
  audience: Harbour Bank executive committee and CRO
  chrome:
    page_numbers:
      enabled: true
  date: October 2026
  source: Regulator's 2025 review; Harbour Bank management information 2023-2025
  template: midnight-blue
  title: Harbour Bank ERM uplift proposal
slides:
  - id: cover
    kind: title
    subtitle: Proposal for Harbour Bank executive committee, October 2026
    title: Enterprise risk management uplift
  - bottom_line: "Ask: approve option 2 and a steering committee chaired by the CRO."
    id: exec
    kind: executive_summary
    points:
      - lead: The regulator rated risk governance 'needs improvement'.
        support: "14 findings: 3 high (appetite not cascaded, 2nd line under-resourced, no integrated reporting), 6 medium, 5 low; deadline 30 June 2027."
      - lead: Operational losses have nearly doubled in two years.
        support: EUR 6.1M in 2023 to EUR 11.2M in 2025, above the EUR 8M appetite and above the peer median of about 0.02% of assets.
      - lead: Two of five appetite metrics are breached today.
        support: Operational and cyber are breached, conduct is amber; only credit and liquidity sit within appetite.
      - lead: Co-delivery (option 2, EUR 2.1M) is the right balance.
        support: A joint team transfers capability to the bank's 2nd line while keeping the June 2027 deadline credible.
    title: Approve co-delivery now to close 14 findings before June 2027
  - id: findings
    kind: kpi_snapshot
    kpis:
      - comparator: 3 high / 6 med / 5 low
        label: Findings raised
        value: "14"
      - label: High findings
        value: "3"
      - delta: "+33% YoY"
        label: Op-risk losses 2025
        value: EUR 11.2M
      - comparator: 9 months from today
        label: Remediation deadline
        value: 30 Jun 2027
    takeaway: The three high findings are the same three gaps the target operating model closes.
    title: 14 regulatory findings must be closed in nine months
  - corner_label: Risk type
    criteria:
      - label: Status
        scale: rag
      - label: Current
        scale: text
      - label: Limit
        scale: text
    decisive_criterion: Status
    highlight_label: Breached
    id: appetite
    kind: option_matrix
    options:
      - name: Credit
        scores:
          - green
          - NPL 2.1%
          - 3%
      - name: Liquidity
        scores:
          - green
          - LCR 148%
          - 110%
      - name: Operational
        scores:
          - red
          - EUR 11.2M
          - EUR 8M
      - name: Conduct
        scores:
          - amber
          - "37"
          - "30"
      - name: Cyber
        scores:
          - red
          - "2"
          - "0"
    recommended:
      - Operational
      - Cyber
    takeaway: Operational and cyber are breached; conduct is drifting towards its limit.
    title: Two of five risk appetite metrics are breached, one is amber
  - arrangement: main_left
    id: losses
    kind: regions
    regions:
      - chart:
          data:
            categories:
              - "2023"
              - "2024"
              - "2025"
            series:
              - name: Losses
                values:
                  - 6.1
                  - 8.4
                  - 11.2
          type: bar
        heading: Operational-risk losses
        kind: chart
        size_pct: 62
        unit: EUR M
      - context: Peer median about 0.02% of assets, roughly EUR 8.4M for Harbour Bank
        kind: stat
        label: Op-risk losses 2025
        size_pct: 50
        value: EUR 11.2M
      - bullets:
          - Controls are self-assessed by 1,200 owners with no independent testing
          - No integrated reporting, so repeat incidents are not spotted across units
        heading: Why losses are rising
        kind: text
        size_pct: 50
    takeaway: Losses exceed both the EUR 8M appetite and the peer median.
    title: Operational losses rose 84% in two years to EUR 11.2M
  - id: heatmap
    kind: raw_json2pptx
    slide:
      content:
        - placeholder_id: title
          text_value: Cyber is the only high-likelihood, high-impact risk; three more are high impact
          type: text
      layout_id: blank-title
      pattern:
        name: capability-heatmap
        values:
          columns:
            - cells:
                - text: Model risk
                  tier: 0
                - text: Climate
                  tier: 1
              header: Low likelihood
              sublabel: 2 risks
            - cells:
                - text: Third-party outage
                  tier: 0
                - text: Conduct
                  tier: 1
                - text: Fraud
                  tier: 2
              header: Medium likelihood
              sublabel: 3 risks
            - cells:
                - text: Cyber
                  tier: 0
              header: High likelihood
              sublabel: 1 risk
          tiers:
            - description: material loss
              label: High impact
            - description: contained loss
              label: Medium impact
            - description: minor loss
              label: Low impact
      slide_type: content
  - columns:
      - header: Today
        items:
          - "1st line: 1,200 control owners self-assess their controls"
          - "2nd line: Risk & Compliance, 28 FTE"
          - "3rd line: Internal Audit, 12 FTE"
          - "Weakness: risk appetite not cascaded below the board"
          - "Weakness: 2nd line too thin to challenge the business"
          - "Weakness: no integrated risk reporting"
      - header: Target (June 2027)
        items:
          - "1st line: 1,200 owners trained, controls tested quarterly"
          - "2nd line: Risk & Compliance, 44 FTE (+16)"
          - "3rd line: Internal Audit, 12 FTE, assures the new framework"
          - Appetite cascaded to business-unit limits and KRIs
          - 2nd line resourced to 44 FTE by March 2027
          - One integrated risk report to the board monthly
    id: lines
    kind: comparison
    takeaway: Same three lines; the 2nd line grows and the reporting becomes one view.
    title: The target model adds 16 FTE to the 2nd line and one integrated report
  - foundation:
      - Three lines of defence with clear accountabilities
      - [People, Data, Technology]
    id: tom
    kind: pillars
    objective: Risk governance rated effective by 30 June 2027
    pillars:
      - body:
          - Appetite cascaded to BU limits
          - CRO-chaired steering committee
        title: Governance and appetite
      - body:
          - Common taxonomy
          - Quarterly top-risk review
        title: Risk identification and assessment
      - body:
          - 1,200 owners trained
          - Independent control testing
        title: Control framework
      - body:
          - One integrated risk report
          - Single risk data platform
        title: Reporting and data
    takeaway: Each pillar closes at least one high finding.
    title: Four pillars take risk governance from 'needs improvement' to effective
  - id: options
    kind: decision
    options:
      - detail: We design the framework; the bank implements with its 28-FTE 2nd line. Lowest cost, highest delivery risk.
        label: "Option 1: Advisory only, EUR 0.9M"
      - detail: Joint team designs and builds; capability transfers to the bank's 2nd line as it grows to 44 FTE.
        label: "Option 2: Co-delivery, EUR 2.1M"
        recommended: true
      - detail: We run the programme office end to end. Fastest, but little capability stays with the bank.
        label: "Option 3: Full programme office, EUR 3.4M"
    recommendation: Approve option 2 and a steering committee chaired by the CRO.
    title: Co-delivery at EUR 2.1M balances speed, cost and capability transfer
  - id: roadmap
    kind: roadmap
    title: Four phases and two parallel tracks finish before the 30 June 2027 deadline
    phases:
      - name: Mobilise
        date_label: Jul-Aug 2026
        description: Steering committee chartered; joint team on site; baseline of the 14 findings agreed
      - name: Design
        date_label: Sep-Nov 2026
        description: Appetite cascade, taxonomy and control framework designed with the 2nd line
      - name: Build
        date_label: Dec 2026-Mar 2027
        description: Controls tested independently; 2nd line hired to 44 FTE; reporting built
      - name: Embed
        date_label: Apr-Jun 2027
        description: First integrated board report; findings closed and evidenced to the regulator
    parallel_tracks:
      - Data and reporting platform (Sep 2026 - Jun 2027)
      - 1,200 control owners trained (Dec 2026 - Jun 2027)
    takeaway: Every phase ends before the regulator's 30 June 2027 deadline; the two tracks start in Design and Build.
  - actions:
      - action: Approve option 2 and the EUR 2.1M budget
        date: 15 Oct 2026
        owner: Executive committee
      - action: Constitute the steering committee and charter
        date: 31 Oct 2026
        owner: CRO
      - action: Confirm joint team and 2nd-line hiring plan to 44 FTE
        date: 30 Nov 2026
        owner: CRO / HR
      - action: Submit remediation plan to the regulator
        date: 15 Dec 2026
        owner: CEO
    decisions:
      - Approve option 2 (co-delivery, EUR 2.1M)
      - Approve a steering committee chaired by the CRO
    id: next
    kind: next_steps
    title: Four actions start the programme this quarter
