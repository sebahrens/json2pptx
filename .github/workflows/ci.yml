name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Which groups of jobs this change needs (scripts/ci_changed_paths.sh): a
  # push that did not touch a job's inputs skips it. A skipped job counts as
  # passed for a required check.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.paths.outputs.go }}
      svggen: ${{ steps.paths.outputs.svggen }}
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          scripts/ci_changed_paths.sh "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  template-portability-rendered:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress libreoffice-common imagemagick fonts-liberation fonts-dejavu-core
          if ! command -v magick >/dev/null; then printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null; sudo chmod +x /usr/local/bin/magick; fi
      - name: Build generator
        run: go build -o ./bin/json2pptx ./cmd/json2pptx
      - name: Run required rendered portability matrix
        env:
          PORTABILITY_RENDER_REQUIRED: "1"
          PORTABILITY_RENDER_INTEGRATION: "1"
          JSON2PPTX_BINARY: ${{ github.workspace }}/bin/json2pptx
        run: go test ./tests/quality -run 'TestPortability' -v -count=1 -timeout=10m
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: template-portability-rendered
          path: output/portability-matrix

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 100
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fonts and SVG tools for rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core librsvg2-bin

      - name: Build
        run: go build ./...

      # cmd/json2pptx is by far the heaviest package under -race; it runs as its
      # own step with its own budget so its growth cannot starve the rest of the
      # module, and the two profiles are merged for the threshold check
      # (go-slide-creator-s2s53). Its tests run one after another, so the suite
      # is split into parallel shards over the runner's cores and the shard
      # profiles are merged into one (go-slide-creator-zpgmp).
      #
      # The shards are balanced by scripts/ci_test_durations.txt. The step is
      # killed at 50 minutes; a shard that takes more than 30 fails it with
      # the slowest tests named, so growth is seen while there is still room
      # (go-slide-creator-q7cpq). The script's header says what to do then.
      - name: Test with coverage (cmd/json2pptx)
        timeout-minutes: 50
        env:
          SHARD_BUDGET_SECONDS: "2100"
          SHARD_BUDGET_ENFORCE: "1"
        run: scripts/ci_test_cmd_shards.sh 4 coverage-cmd.out

      - name: Test with coverage (other packages)
        run: go test $(go list ./... | grep -v '/cmd/json2pptx$') -short -v -race -coverprofile=coverage-rest.out -covermode=atomic -timeout=25m

      - name: Merge coverage profiles
        run: |
          cp coverage-rest.out coverage.out
          tail -n +2 coverage-cmd.out >> coverage.out

      - name: Check coverage threshold
        run: |
          # The summary line only: a function with "total" in its name is a
          # second match, the comparison below is then a syntax error and the
          # step passed whatever the coverage was (go-slide-creator-4hkrb).
          COVERAGE=$(go tool cover -func=coverage.out | awk '$1 == "total:" {print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if ! [[ "$COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::could not read the total coverage from the profile: '${COVERAGE}'"
            exit 1
          fi
          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✓ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | grep -E '^[a-z]' | awk '{printf "| %s | %s |\n", $1, $3}' | tail -n +1 | head -30 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 | awk '{printf "**Total: %s**\n", $3}' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html

  template-pattern-matrix:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Renders every named pattern × every bundled template via runJSONMode and
    # writes a pass/fail markdown matrix under output/test-matrix/MATRIX.md.
    # Owned by go-slide-creator-qxgj; covers the template-coverage epic
    # (go-slide-creator-y8nc). The artefact gives reviewers a per-template
    # green/red dashboard before any template change merges.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fonts and SVG tools for rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core librsvg2-bin

      - name: Run template × pattern matrix
        run: go test -run TemplatePatternMatrix ./cmd/json2pptx/... -count=1 -timeout=10m

      - name: Upload matrix artefact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: template-pattern-matrix
          path: output/test-matrix/MATRIX.md

  skill-sync:
    # Runs on pushes to main too: most commits land directly, so a PR-only gate
    # skipped the commits that land most often (go-slide-creator-3fzw3). On a
    # push the base is the pre-push tip; the script falls back to HEAD~1 when
    # that ref is absent (new branch / force-push).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check skill-code-docs sync
        run: bash scripts/check-skill-sync.sh ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check skill canonical location (no .claude/skills/ tracking)
        run: bash scripts/check-skill-canonical.sh

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # One source of truth for the linter version, shared with `make lint`.
      # A local run on a different version both hides and invents findings
      # (go-slide-creator-rc9y).
      - name: Read pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

  repo-hygiene:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure install.sh has executable bit set in git
        run: |
          MODE=$(git ls-files --stage install.sh | awk '{print $1}')
          if [ "$MODE" != "100755" ]; then
            echo "::error file=install.sh::install.sh must be committed with executable bit (mode 100755), got ${MODE}. Run: git update-index --chmod=+x install.sh"
            exit 1
          fi
          echo "✓ install.sh has executable bit set (${MODE})"

  svggen-test:
    needs: changes
    if: needs.changes.outputs.svggen == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: svggen/go.mod

      # The module-wide run includes TestGolden even in short mode. Run it once
      # under the race detector, then verify no test rewrote golden files.
      # Intentional visual changes must commit regenerated goldens:
      # cd svggen && go test -run TestGolden -update -count=1 .
      - name: Test svggen module
        run: cd svggen && go test ./... -short -v -race -timeout=10m

      - name: Check svggen golden files (no drift)
        run: |
          if ! git diff --exit-code --stat -- svggen/testdata/golden || [ -n "$(git status --porcelain -- svggen/testdata/golden)" ]; then
            echo "::error::svggen golden files drifted or were written during tests; regenerate intentionally and commit them"
            exit 1
          fi

      - name: Vet svggen module
        run: cd svggen && go vet ./...

  svggen-lint:
    needs: changes
    if: needs.changes.outputs.svggen == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: svggen/go.mod

      - name: Read pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint on svggen
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: svggen
          args: --timeout=5m

  security:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # v1.8.0 requires Go 1.26; keep this aligned with the patched Go 1.25 baseline.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan svggen module
        working-directory: svggen
        run: govulncheck ./...

  palette-parity:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fonts, LibreOffice, poppler, ImageMagick and librsvg for rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core \
            libreoffice-impress libreoffice-common poppler-utils imagemagick librsvg2-bin
          # audit-palette rasterises through internal/render, which uses
          # ImageMagick like every other render path (go-slide-creator-rdql).
          # Ubuntu ships v6, whose CLI is `convert`; the render package looks
          # for `magick` first and falls back to it, but the shim keeps the
          # job's tooling identical to the lint/test job above.
          if ! command -v magick >/dev/null; then printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null; sudo chmod +x /usr/local/bin/magick; fi

      - name: Run cross-engine palette parity test
        env:
          PALETTE_PARITY_TEST: "1"
        run: go test ./tests/palette_parity/... -v -count=1 -timeout=5m

      - name: Build json2pptx for palette audit smoke check
        run: go build -o ./bin/json2pptx ./cmd/json2pptx

      - name: Generate smoke deck for palette audit
        run: |
          mkdir -p ./smoke
          ./bin/json2pptx generate \
            -json ./tests/palette_parity/deck.json \
            -template midnight-blue \
            -templates-dir ./templates \
            -output ./smoke

      - name: Run audit-palette smoke check
        run: |
          # Score both the legacy pair check and the theme-reference check in
          # one render. A zero-match report is not evidence of palette parity.
          ./bin/json2pptx audit-palette -mode both -format json -max-delta-e 2.0 -max-theme-delta-e 15.0 \
            -output ./smoke/audit.json ./smoke/*.pptx > /dev/null
          PAIRS=$(jq '[.slides[].pair_count] | add' ./smoke/audit.json)
          MATCHES=$(jq '[.slides[].theme_match_count] | add' ./smoke/audit.json)
          if [ "$PAIRS" -lt 1 ]; then
            echo "::error::audit-palette produced 0 (pic, shape) pairs — smoke deck regressed"
            cat ./smoke/audit.json
            exit 1
          fi
          if [ "$MATCHES" -lt 1 ]; then
            echo "::error::audit-palette produced 0 theme matches — smoke deck regressed"
            cat ./smoke/audit.json
            exit 1
          fi
          echo "audit-palette: $PAIRS pair(s), $MATCHES theme color(s) scored within ΔE thresholds"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: palette-parity-failure
          path: |
            /tmp/go-build*/palette_parity*
            /tmp/TestPaletteParity_CrossEngine*
            ./smoke

  pptx-validation:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fonts and LibreOffice for rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core \
            libreoffice-impress libreoffice-common poppler-utils

      - name: Build tools
        run: |
          go build -o ./bin/json2pptx ./cmd/json2pptx
          go build -o ./bin/testrand ./cmd/testrand
          go build -o ./bin/validatepptx ./cmd/validatepptx
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Generate PPTX from random test decks
        run: |
          mkdir -p ./test_output
          TEMPLATES=("template_2" "forest-green" "midnight-blue" "warm-coral")

          echo "## PPTX Generation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for template in "${TEMPLATES[@]}"; do
            output_name="ci_${template}.pptx"
            json_file="./test_output/${template}.json"
            echo "Generating: $output_name"

            # Generate a random JSON deck for this template
            ./bin/testrand generate --seed=42 --output="$json_file"

            if ./bin/json2pptx generate -json "$json_file" -template "$template" -output ./test_output; then
              generated=$(ls -t ./test_output/*.pptx 2>/dev/null | head -1)
              if [ -n "$generated" ]; then
                mv "$generated" "./test_output/$output_name"
                echo "✓ Generated: $output_name" | tee -a $GITHUB_STEP_SUMMARY
              fi
            else
              echo "✗ Failed: $output_name" | tee -a $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Validate PPTX structure
        id: validate
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## PPTX Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Slides | SVG | PNG | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-----|-----|--------|" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for pptx in ./test_output/*.pptx; do
            [ -f "$pptx" ] || continue
            filename=$(basename "$pptx")

            # Run validation and capture JSON output
            if result=$(./bin/validatepptx -json "$pptx" 2>&1); then
              slides=$(echo "$result" | jq -r '.slide_count // 0')
              svg=$(echo "$result" | jq -r '.media_stats.SVG // 0')
              png=$(echo "$result" | jq -r '.media_stats.PNG // 0')
              is_valid=$(echo "$result" | jq -r '.is_valid')

              if [ "$is_valid" = "true" ]; then
                echo "| $filename | $slides | $svg | $png | ✓ |" >> $GITHUB_STEP_SUMMARY
              else
                errors=$(echo "$result" | jq -r '.errors[]?' | head -1)
                echo "| $filename | $slides | $svg | $png | ✗ $errors |" >> $GITHUB_STEP_SUMMARY
                FAILED=1
              fi
            else
              echo "| $filename | - | - | - | ✗ Error |" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            fi
          done

          echo "validation_failed=$FAILED" >> $GITHUB_OUTPUT

      - name: LibreOffice conformance check
        id: conformance
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## LibreOffice Conformance Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | PDF Size | Pages | Slides | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          CONFORMANCE_FAILED=0
          for pptx in ./test_output/*.pptx; do
            [ -f "$pptx" ] || continue
            filename=$(basename "$pptx")
            pdf_file="${pptx%.pptx}.pdf"

            # Convert PPTX to PDF via LibreOffice headless
            if timeout 120 libreoffice --headless --convert-to pdf \
                --outdir ./test_output "$pptx" >/dev/null 2>&1; then

              if [ -f "$pdf_file" ]; then
                pdf_size=$(wc -c < "$pdf_file" | tr -d ' ')

                # Check PDF is non-trivial (>1KB)
                if [ "$pdf_size" -lt 1024 ]; then
                  echo "| $filename | ${pdf_size}B | - | - | ✗ Corrupt PDF |" >> $GITHUB_STEP_SUMMARY
                  CONFORMANCE_FAILED=1
                  continue
                fi

                # Get page count and slide count for comparison
                pdf_pages=$(pdfinfo "$pdf_file" 2>/dev/null | grep "^Pages:" | awk '{print $2}' || echo "?")
                slide_count=$(./bin/validatepptx -json "$pptx" 2>/dev/null | jq -r '.slide_count // 0' || echo "?")

                # Warn if page count doesn't match slide count
                status="✓"
                if [ "$pdf_pages" != "?" ] && [ "$slide_count" != "?" ] && [ "$pdf_pages" != "$slide_count" ]; then
                  status="⚠ pages≠slides"
                fi

                echo "| $filename | ${pdf_size}B | $pdf_pages | $slide_count | $status |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $filename | - | - | - | ✗ No PDF output |" >> $GITHUB_STEP_SUMMARY
                CONFORMANCE_FAILED=1
              fi
            else
              echo "| $filename | - | - | - | ✗ LibreOffice failed |" >> $GITHUB_STEP_SUMMARY
              CONFORMANCE_FAILED=1
            fi
          done

          echo "conformance_failed=$CONFORMANCE_FAILED" >> $GITHUB_OUTPUT

      - name: Upload PPTX artifacts on failure
        if: steps.validate.outputs.validation_failed == '1' || steps.conformance.outputs.conformance_failed == '1'
        uses: actions/upload-artifact@v6
        with:
          name: pptx-validation-failures
          path: |
            ./test_output/*.pptx
            ./test_output/*.pdf

      - name: Fail if validation errors
        if: steps.validate.outputs.validation_failed == '1' || steps.conformance.outputs.conformance_failed == '1'
        run: |
          if [ "${{ steps.validate.outputs.validation_failed }}" = "1" ]; then
            echo "::error::PPTX structural validation failed. See artifacts for manual review."
          fi
          if [ "${{ steps.conformance.outputs.conformance_failed }}" = "1" ]; then
            echo "::error::LibreOffice conformance check failed. Generated PPTX cannot be opened by presentation software."
          fi
          exit 1

  corpus-headless:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Generates every examples/*.json against every bundled template and
    # round-trips each output through headless LibreOffice. Asserts that
    # soffice emits no repair/corruption/invalid/malformed warnings — the
    # "zero needs repair" guarantee tracked by go-slide-creator-0myv.
    #
    # The job also runs, without -short and without -race, every test of
    # cmd/json2pptx that does less under -short — a part of its matrix to keep
    # the sharded race step inside its time budget (go-slide-creator-q7cpq),
    # or nothing at all: the tests named "AcrossTemplates", and
    # TestShortReducedMatricesCorpus (cmd/json2pptx/full_matrix_corpus_test.go)
    # for the rest. TestShortSensitiveTestsRunInCorpus, in the same file, fails
    # when a test reads testing.Short() and is in neither group
    # (go-slide-creator-c9w86). The other packages' tests of that kind run in
    # render-integration.
    #
    # Two legs share the selection 'Corpus|AcrossTemplates' so neither nears
    # the time limit: the tests named "Corpus", and the "AcrossTemplates"
    # tests that are not also named "Corpus" (go-slide-creator-efhg2).
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: corpus
            run: "Corpus"
            skip: "^$"
          - leg: across-templates
            run: "AcrossTemplates"
            skip: "Corpus"
    name: corpus-headless (${{ matrix.leg }})
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fonts and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core \
            libreoffice-impress libreoffice-common librsvg2-bin

      - name: Run corpus headless round-trip
        run: go test -tags=integration ./cmd/json2pptx/... -run '${{ matrix.run }}' -skip '${{ matrix.skip }}' -count=1 -timeout=40m -v

  render-integration:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Exercises the tool-gated render and SVG-conversion tests that skip by
    # default when LibreOffice/ImageMagick/rsvg-convert are absent. Without this
    # job the internal/render integration tests (TestIntegrationRenderSlide,
    # TestIntegrationRenderDeck) and the rsvg/EMF SVG-converter tests never run
    # in CI, so a default `go test ./...` can be green while real render paths
    # are unexercised. See docs/TESTING.md for the test-tier classification.
    # Tracked by go-slide-creator-p9vi.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fonts and render toolchain
        run: |
          sudo apt-get update
          # fonts-crosextra-carlito: the metric-compatible face LibreOffice
          # draws Calibri in — the render-truth check below reads back what
          # LibreOffice does to text set in it.
          sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-crosextra-carlito \
            libreoffice-impress libreoffice-common librsvg2-bin imagemagick

      - name: Build json2pptx
        run: go build -o ./bin/json2pptx ./cmd/json2pptx

      - name: Generate render fixture deck
        run: |
          mkdir -p /tmp/render-test
          ./bin/json2pptx generate \
            -json examples/basic-deck.json \
            -template midnight-blue \
            -templates-dir templates \
            -output /tmp/render-test
          # The render integration tests look for a fixed filename; normalise
          # whatever name the generator emitted to the expected path.
          generated=$(ls -t /tmp/render-test/*.pptx | head -1)
          if [ "$generated" != "/tmp/render-test/basic-deck.pptx" ]; then
            mv "$generated" /tmp/render-test/basic-deck.pptx
          fi
          ls -l /tmp/render-test/

      - name: Run render + SVG-conversion integration tests
        env:
          RENDER_TEST_PPTX: /tmp/render-test/basic-deck.pptx
        run: |
          go test ./internal/render/... -run Integration -count=1 -v -timeout=10m
          go test ./internal/generator/... -run 'SVGConverter|SVG_' -count=1 -v -timeout=10m

      # The test job runs every package under -short, so a test that skips or
      # does less under -short ran nowhere: the SVG stress generators of
      # internal/testrand drifted from the svggen validators unseen
      # (go-slide-creator-4qd39). This is the same suite without -short and
      # without -race, on the host that has the render toolchain. cmd/json2pptx
      # is left out: corpus-headless runs its short-sensitive tests.
      - name: Run the internal and svggen tests without -short
        run: |
          go test ./internal/... -count=1 -timeout=10m
          (cd svggen && go test ./... -count=1 -timeout=5m)

      # Render truth (go-slide-creator-bhbtk): generate every pattern exemplar,
      # convert the deck pptx -> pptx through LibreOffice and read back the
      # fontScale it wrote onto each shape. A shape LibreOffice had to shrink
      # is a box the engine sized too small for its text, whatever the engine's
      # own measure says. Calibri templates only: Carlito has Calibri's
      # metrics, so a shrink is the engine's and not a font substitution's.
      - name: Render-truth check (LibreOffice re-fit read-back)
        env:
          RENDER_TRUTH_TEMPLATES: midnight-blue forest-green
        run: |
          matched=$(fc-match Calibri)
          echo "Calibri resolves to: $matched"
          case "$matched" in
            *Carlito*|*Calibri*) ;;
            *) echo "::error::Calibri does not resolve to Carlito; the render-truth check would read a font substitution as a shrink"; exit 1 ;;
          esac
          go test ./cmd/json2pptx -run 'TestRenderTruthExemplars' -count=1 -timeout=10m
