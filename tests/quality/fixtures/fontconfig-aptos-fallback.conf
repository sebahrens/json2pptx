<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep an installed original first; use Arial only as its fallback. -->
  <alias binding="strong">
    <family>Aptos</family>
    <accept><family>Arial</family></accept>
  </alias>
  <alias binding="strong">
    <family>Aptos Light</family>
    <accept><family>Arial</family></accept>
  </alias>
</fontconfig>
